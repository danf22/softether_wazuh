AWSTemplateFormatVersion: '2010-09-09'
Description: Deploy Softether on Amazon EC2

Parameters:
  LatestAmiId :
    Type : 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-ebs
  NameBurtualHubVPN:
    Type: String
    Description: HUB Name Softether VPN.
  EC2InstanceType:
    Type: String
    Description: EC2 instance type for the Softether VPN.
    Default: t3a.medium
  IPsecPreSharedKey:
    Type: String
    NoEcho: true
    Description: Ipsec Pre-shared Key.
  DefaultVPNUser:
    Type: String
    Description: Default VPN user name to create.
  DefaultVPNUserPassword:
    Description: "Password for the default VPN user. Must be between 8 and 64 characters and contain at least one uppercase letter, one lowercase letter, one number, and one of the following symbols: .*+?-"
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[.*+?-]).{8,64}$"
  SubnetIdPublicSoftether:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet where the Softether will be deployed need to be Public.
  SubnetIdPrivateWazuh:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet where the Wazuh will be deployed need to be Private.
  SoftetherPassword:
    Description: "Password for Softether. Must be between 8 and 64 characters and contain at least one uppercase letter, one lowercase letter, one number, and one of the following symbols: .*+?-"
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[.*+?-]).{8,64}$"
  WazuhPassword:
    Description: "Password for Wazuh. Must be between 8 and 64 characters and contain at least one uppercase letter, one lowercase letter, one number, and one of the following symbols: .*+?-"
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[.*+?-]).{8,64}$"
    
  VPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the EC2 instance will be deployed

Resources:
  SoftetherInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SoftetherRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
         - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Path: /
  SoftetherInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      InstanceProfileName: SoftetherInstanceProfile
      Roles:
        - !Ref SoftetherInstanceRole

  SoftetherNetworkInterface1:
    Type: "AWS::EC2::NetworkInterface"
    Properties:
      Description: "Additional Network Interface 1"
      GroupSet:
        - !Ref SecurityGroup # Security Group ID
      SubnetId: !Ref SubnetIdPublicSoftether # Subnet ID
      Tags:
        - Key: Name
          Value: "Softether"
  SoftetherConfigVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: 5
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: Softether-Config

  SoftetherInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn: 
      - SoftetherNetworkInterface1
      - WazuhInstance
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref EC2InstanceType
      IamInstanceProfile: !Ref SoftetherInstanceProfile
      Volumes:
        - Device: /dev/xvdf
          VolumeId: !Ref SoftetherConfigVolume
      NetworkInterfaces:
        - 
          DeviceIndex: 1
          GroupSet:
            - !Ref SecurityGroup # Security Group ID
          SubnetId: !Ref SubnetIdPublicSoftether # Subnet ID of the primary interface
        - 
          DeviceIndex: 0
          NetworkInterfaceId: !Ref SoftetherNetworkInterface1

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -x
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          
          # Install CloudFormation helper scripts
          yum install -y aws-cfn-bootstrap
          
          # Habilitar IP Forwarding (persistent via sysctl.d)
          echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-ip-forward.conf
          sysctl --system
          
          # Continuar con la instalación de Development Tools, etc.
          yum -y groupinstall "Development Tools"
          yum -y update
          
          # softether version 4.44
          cd /usr/local/
          wget https://github.com/SoftEtherVPN/SoftEtherVPN_Stable/releases/download/v4.44-9807-rtm/softether-vpnserver-v4.44-9807-rtm-2025.04.16-linux-x64-64bit.tar.gz
          tar xvf softether-vpnserver-*
          rm -rf softether-vpnserver-*
          cd vpnserver
          
          # Accept license automatically
          yes 1 | make
          
          # Mount the config EBS volume
          CONFIG_DEV=/dev/xvdf
          CONFIG_MNT=/mnt/vpnconfig
          # Format only if no filesystem exists
          blkid $CONFIG_DEV || mkfs.ext4 $CONFIG_DEV
          mkdir -p $CONFIG_MNT
          mount $CONFIG_DEV $CONFIG_MNT
          # Persist mount across reboots
          echo "$CONFIG_DEV $CONFIG_MNT ext4 defaults,nofail 0 2" >> /etc/fstab
          
          # If config already exists on the EBS volume, restore it
          FIRST_RUN=true
          if [ -f $CONFIG_MNT/vpn_server.config ]; then
            FIRST_RUN=false
            cp $CONFIG_MNT/vpn_server.config /usr/local/vpnserver/vpn_server.config
          fi
          
          # Create systemd service for vpnserver
          cat > /etc/systemd/system/vpnserver.service << 'SVCEOF'
          [Unit]
          Description=SoftEther VPN Server
          After=network-online.target
          Wants=network-online.target
          
          [Service]
          Type=forking
          ExecStart=/usr/local/vpnserver/vpnserver start
          ExecStop=/usr/local/vpnserver/vpnserver stop
          Restart=on-failure
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target
          SVCEOF
          # Strip leading whitespace from the unit file
          sed -i 's/^[[:space:]]*//' /etc/systemd/system/vpnserver.service
          
          systemctl daemon-reload
          systemctl enable vpnserver
          systemctl start vpnserver
          
          # Wait for VPN server to be listening
          for i in $(seq 1 30); do
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"" /CMD About && break
            sleep 2
          done
          
          rpm --import https://packages.wazuh.com/key/GPG-KEY-WAZUH
          cat << 'EOF' > /etc/yum.repos.d/wazuh.repo
          [wazuh]
          gpgcheck=1
          gpgkey=https://packages.wazuh.com/key/GPG-KEY-WAZUH
          enabled=1
          name=EL-\$releasever - Wazuh
          baseurl=https://packages.wazuh.com/4.x/yum/
          protect=1
          EOF
          AGENT_NAME_FOR_WAZUH="Softether-VPN-Server-Agent"
          yum install wazuh-agent -y
          sed -i "s|<address>MANAGER_IP</address>|<address>${WazuhInstance.PrivateIp}</address>|g" /var/ossec/etc/ossec.conf
          sed -i '/<\/ossec_config>/i \ \ <localfile>\n\ \ \ <location>/usr/local/vpnserver/security_log/${NameBurtualHubVPN}/sec_20%y%m%d.log</location>\n\ \ \ <log_format>syslog</log_format>\n\ \ </localfile>' /var/ossec/etc/ossec.conf
          # Add traffic monitoring log to Wazuh agent
          sed -i '/<\/ossec_config>/i \ \ <localfile>\n\ \ \ <location>/var/log/softether-traffic.log</location>\n\ \ \ <log_format>syslog</log_format>\n\ \ </localfile>' /var/ossec/etc/ossec.conf
          
          # Create traffic monitoring script
          cat > /usr/local/bin/softether-traffic-monitor.sh << 'MONEOF'
          #!/bin/bash
          # SoftEther Traffic Monitor - collects session stats for Wazuh analysis
          VPNCMD=/usr/local/vpnserver/vpncmd
          HUB_NAME="${NameBurtualHubVPN}"
          PASSWORD_FILE=/usr/local/vpnserver/.server_password
          LOG_FILE=/var/log/softether-traffic.log
          BASELINE_DIR=/var/lib/softether-monitor
          mkdir -p $BASELINE_DIR
          
          # Read server password
          if [ -f "$PASSWORD_FILE" ]; then
            SVR_PASS=$(cat "$PASSWORD_FILE")
          else
            SVR_PASS=""
          fi
          
          # Get active sessions
          SESSIONS=$($VPNCMD localhost /SERVER /PASSWORD:"$SVR_PASS" /HUB:"$HUB_NAME" /CMD SessionList 2>/dev/null | grep -oP 'SID-[^\s|]+' | grep -v SECURENAT)
          
          for SESSION in $SESSIONS; do
            # Get session details
            INFO=$($VPNCMD localhost /SERVER /PASSWORD:"$SVR_PASS" /HUB:"$HUB_NAME" /CMD SessionGet "$SESSION" 2>/dev/null)
            
            USERNAME=$(echo "$INFO" | grep "User Name" | head -1 | awk -F'|' '{print $2}' | xargs)
            SRC_IP=$(echo "$INFO" | grep "Client IP Address" | head -1 | awk -F'|' '{print $2}' | xargs)
            TX_BYTES=$(echo "$INFO" | grep "Outgoing Data Size" | head -1 | awk -F'|' '{print $2}' | tr -d ',' | grep -oP '\d+')
            RX_BYTES=$(echo "$INFO" | grep "Incoming Data Size" | head -1 | awk -F'|' '{print $2}' | tr -d ',' | grep -oP '\d+')
            TX_PACKETS=$(echo "$INFO" | grep "Outgoing Unicast Packets" | head -1 | awk -F'|' '{print $2}' | tr -d ',' | grep -oP '\d+')
            RX_PACKETS=$(echo "$INFO" | grep "Incoming Unicast Packets" | head -1 | awk -F'|' '{print $2}' | tr -d ',' | grep -oP '\d+')
            CONN_TIME=$(echo "$INFO" | grep "Connection Started at" | head -1 | awk -F'|' '{print $2}' | xargs)
            
            [ -z "$USERNAME" ] && continue
            [ -z "$TX_BYTES" ] && TX_BYTES=0
            [ -z "$RX_BYTES" ] && RX_BYTES=0
            [ -z "$TX_PACKETS" ] && TX_PACKETS=0
            [ -z "$RX_PACKETS" ] && RX_PACKETS=0
            
            # Calculate traffic rate (bytes since last check)
            BASELINE_FILE="$BASELINE_DIR/$SESSION.baseline"
            PREV_TX=0
            PREV_RX=0
            if [ -f "$BASELINE_FILE" ]; then
              PREV_TX=$(awk 'NR==1' "$BASELINE_FILE")
              PREV_RX=$(awk 'NR==2' "$BASELINE_FILE")
            fi
            echo "$TX_BYTES" > "$BASELINE_FILE"
            echo "$RX_BYTES" >> "$BASELINE_FILE"
            
            DELTA_TX=$((TX_BYTES - PREV_TX))
            DELTA_RX=$((RX_BYTES - PREV_RX))
            [ "$DELTA_TX" -lt 0 ] && DELTA_TX=$TX_BYTES
            [ "$DELTA_RX" -lt 0 ] && DELTA_RX=$RX_BYTES
            
            # Log the traffic data
            TIMESTAMP=$(date '+%b %d %H:%M:%S')
            HOSTNAME=$(hostname)
            echo "$TIMESTAMP $HOSTNAME softether-traffic: session=$SESSION user=$USERNAME srcip=$SRC_IP tx_bytes=$TX_BYTES rx_bytes=$RX_BYTES delta_tx=$DELTA_TX delta_rx=$DELTA_RX tx_packets=$TX_PACKETS rx_packets=$RX_PACKETS connected_since=\"$CONN_TIME\"" >> "$LOG_FILE"
            
            # Alert on high traffic (>100MB in 5 min interval)
            THRESHOLD=104857600
            if [ "$DELTA_TX" -gt "$THRESHOLD" ] || [ "$DELTA_RX" -gt "$THRESHOLD" ]; then
              echo "$TIMESTAMP $HOSTNAME softether-traffic-alert: HIGH_TRAFFIC session=$SESSION user=$USERNAME srcip=$SRC_IP delta_tx=$DELTA_TX delta_rx=$DELTA_RX" >> "$LOG_FILE"
            fi
            
            # Alert on unusual packet ratio (potential port scan or DDoS)
            if [ "$TX_PACKETS" -gt 0 ] && [ "$RX_PACKETS" -gt 0 ]; then
              RATIO=$((TX_PACKETS / RX_PACKETS))
              if [ "$RATIO" -gt 50 ]; then
                echo "$TIMESTAMP $HOSTNAME softether-traffic-alert: UNUSUAL_PACKET_RATIO session=$SESSION user=$USERNAME srcip=$SRC_IP tx_packets=$TX_PACKETS rx_packets=$RX_PACKETS ratio=$RATIO" >> "$LOG_FILE"
              fi
            fi
          done
          
          # Clean up baseline files for sessions that no longer exist
          for BFILE in $BASELINE_DIR/*.baseline; do
            [ -f "$BFILE" ] || continue
            BSESSION=$(basename "$BFILE" .baseline)
            if ! echo "$SESSIONS" | grep -q "$BSESSION"; then
              rm -f "$BFILE"
            fi
          done
          MONEOF
          sed -i 's/^[[:space:]]*//' /usr/local/bin/softether-traffic-monitor.sh
          chmod +x /usr/local/bin/softether-traffic-monitor.sh
          
          # Store the server password for the monitoring script
          echo "${SoftetherPassword}" > /usr/local/vpnserver/.server_password
          chmod 600 /usr/local/vpnserver/.server_password
          
          # Create logrotate config
          cat > /etc/logrotate.d/softether-traffic << 'LREOF'
          /var/log/softether-traffic.log {
              daily
              rotate 30
              compress
              missingok
              notifempty
          }
          LREOF
          
          # Run every 5 minutes
          echo "*/5 * * * * root /usr/local/bin/softether-traffic-monitor.sh" > /etc/cron.d/softether-traffic-monitor
          
          sudo systemctl daemon-reload
          sudo systemctl enable wazuh-agent
          sudo systemctl start wazuh-agent
          sed -i "s/^enabled=1/enabled=0/" /etc/yum.repos.d/wazuh.repo
          
          # Only configure VPN if this is the first run (no existing config on EBS)
          if [ "$FIRST_RUN" = true ]; then
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"" /CMD ServerPasswordSet ${SoftetherPassword}
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"${SoftetherPassword}" /HUB DEFAULT /CMD HubDelete DEFAULT
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"${SoftetherPassword}" /CMD HubCreate "${NameBurtualHubVPN}" /PASSWORD:"${SoftetherPassword}"
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"${SoftetherPassword}" /HUB "${NameBurtualHubVPN}" /CMD IPsecEnable /L2TP:yes /L2TPRAW:yes /ETHERIP:yes /PSK:${IPsecPreSharedKey} /DEFAULTHUB:"${NameBurtualHubVPN}"         
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"${SoftetherPassword}" /HUB:"${NameBurtualHubVPN}" /CMD SecureNatEnable
            sleep 5
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"${SoftetherPassword}" /HUB:"${NameBurtualHubVPN}" /CMD DhcpSet /START:192.168.30.10 /END:192.168.30.200 /MASK:255.255.255.0 /EXPIRE:86400 /GW:192.168.30.1 /DNS:192.168.30.1 /DNS2:8.8.8.8 /DOMAIN:none /LOG:yes /PUSHROUTE:10.0.3.0/255.255.255.0/192.168.30.1
            # Create default VPN user
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"${SoftetherPassword}" /HUB:"${NameBurtualHubVPN}" /CMD UserCreate "${DefaultVPNUser}" /GROUP:none /REALNAME:none /NOTE:none
            /usr/local/vpnserver/vpncmd localhost /SERVER /PASSWORD:"${SoftetherPassword}" /HUB:"${NameBurtualHubVPN}" /CMD UserPasswordSet "${DefaultVPNUser}" /PASSWORD:"${DefaultVPNUserPassword}"
            # Backup config to EBS
            sleep 3
            if [ -f /usr/local/vpnserver/vpn_server.config ]; then
              cp /usr/local/vpnserver/vpn_server.config $CONFIG_MNT/vpn_server.config
            fi
          fi
          
          echo "Configuración de SoftEther VPN completada."
          
          # Send success signal
          /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource SoftetherInstance --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: Softether
    CreationPolicy:
        ResourceSignal:
          Timeout: PT10M
  EIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc 
  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt EIP.AllocationId
      NetworkInterfaceId: !Ref SoftetherNetworkInterface1
  SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Ports for Softether connection
      VpcId: !Ref VPCId
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: 500
          ToPort: 500
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 4500
          ToPort: 4500
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 1701
          ToPort: 1701
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  InstanceSecurityGroupIngress:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId: !Ref SecurityGroup
# Wazuh
  WazuhNetworkInterface1:
    Type: "AWS::EC2::NetworkInterface"
    Properties:
      Description: "Additional Network Interface 1"
      GroupSet:
        - !Ref WazuhSecurityGroup # Security Group ID
      SubnetId: !Ref SubnetIdPrivateWazuh # Subnet ID
      Tags:
        - Key: Name
          Value: "Softether"
  WazuhConfigVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: 10
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: Wazuh-Config
  WazuhSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Wazuh
      VpcId: !Ref VPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1514
          ToPort: 1515
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 1514
          ToPort: 1515
          CidrIp: 0.0.0.0/0
          # Nueva regla para ICMP (ping) desde el Grupo de Seguridad de SoftEther
        - IpProtocol: icmp
          FromPort: -1 # Para ICMP, FromPort es -1 o tipo de ICMP (8 para Echo Request)
          ToPort: -1   # Para ICMP, ToPort es -1 o código de ICMP
          SourceSecurityGroupId: !Ref SecurityGroup # Permite desde SoftEther SG
        # Nueva regla para HTTPS (Wazuh UI) desde el Grupo de Seguridad de SoftEther
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref SecurityGroup # Permite desde SoftEther SG
  WazuhInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref EC2InstanceType
      IamInstanceProfile: !Ref SoftetherInstanceProfile
      Volumes:
        - Device: /dev/xvdg
          VolumeId: !Ref WazuhConfigVolume
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            Iops: 3000
            DeleteOnTermination: true

      NetworkInterfaces:
        - 
          DeviceIndex: 0
          NetworkInterfaceId: !Ref WazuhNetworkInterface1

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -x
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          
          yum install -y aws-cfn-bootstrap
          yum update -y
          
          # Mount the Wazuh config EBS volume
          WCONFIG_DEV=/dev/xvdg
          WCONFIG_MNT=/mnt/wazuhconfig
          blkid $WCONFIG_DEV || mkfs.ext4 $WCONFIG_DEV
          mkdir -p $WCONFIG_MNT
          mount $WCONFIG_DEV $WCONFIG_MNT
          echo "$WCONFIG_DEV $WCONFIG_MNT ext4 defaults,nofail 0 2" >> /etc/fstab
          
          # Check if this is a first run or a restore
          WAZUH_FIRST_RUN=true
          if [ -f $WCONFIG_MNT/ossec.conf ]; then
            WAZUH_FIRST_RUN=false
          fi
          
          # Install Wazuh
          curl -sO https://packages.wazuh.com/4.14/wazuh-install.sh && bash ./wazuh-install.sh -a
          /usr/share/wazuh-indexer/plugins/opensearch-security/tools/wazuh-passwords-tool.sh -u admin -p ${WazuhPassword}
          yum install -y wget
          
          if [ "$WAZUH_FIRST_RUN" = true ]; then
            # First run: configure Wazuh and backup to EBS
            wget https://iplists.firehol.org/files/alienvault_reputation.ipset -O /var/ossec/etc/lists/alienvault_reputation.ipset
            echo "<ATTACKER_IP>" >> /var/ossec/etc/lists/alienvault_reputation.ipset
            wget https://wazuh.com/resources/iplist-to-cdblist.py -O /tmp/iplist-to-cdblist.py
            /var/ossec/framework/python/bin/python3 /tmp/iplist-to-cdblist.py /var/ossec/etc/lists/alienvault_reputation.ipset /var/ossec/etc/lists/blacklist-alienvault
            chown wazuh:wazuh /var/ossec/etc/lists/blacklist-alienvault
            cat << 'EOF' > /var/ossec/etc/rules/Softether_user_access.xml
          <group name="Softether_user_access">
            <rule id="100402" level="0" noalert="1">
              <decoded_as>softether_decoder_access</decoded_as>
              <description>Softether access server messages user</description>
            </rule>
            <rule id="100404" level="3">
              <if_sid>100402</if_sid>
              <match>The new session</match>
              <description>Softether User authentication successful $(srcuser) with ip $(srcip)</description>
            </rule>
          </group>
          EOF
            cat << 'EOF' > /var/ossec/etc/rules/softether_rule.xml
          <group name="softether">
            <rule id="100302" level="0" noalert="1">
              <decoded_as>softether_decoder</decoded_as>
              <description>Softether access server messages grouped</description>
            </rule>
            <rule id="100303" level="3">
              <if_sid>100302</if_sid>
              <match>VPN</match>
              <description>Softether remote attempting connection $(srcip) with the user $(srcuser)</description>
            </rule>
            <rule id="100304" level="5">
              <if_sid>100302</if_sid>
              <match>User authentication failed</match>
              <description>Softether User authentication failed $(srcuser)</description>
            </rule>
            <rule id="100305" level="10">
              <if_sid>100302</if_sid>
              <match>VPN</match>
              <list field="srcip" lookup="address_match_key">etc/lists/blacklist-alienvault</list>
              <description>IP address found in AlienVault reputation database. $(srcip) and trying to achieve them with this user $(srcuser)</description>
            </rule>
            <rule id="100306" level="10" frequency="10" timeframe="120">
              <if_matched_sid>100304</if_matched_sid>
              <description>More than 10 login attempts have been recorded in the las 2 minutes $(srcuser)</description>
            </rule>
            <rule id="100307" level="10" frequency="10" timeframe="120">
              <if_matched_sid>100303</if_matched_sid>
              <description>More than 10 login attempts have been recorded in the las 2 minutes $(srcip)</description>
            </rule>
          </group>
          EOF
            cat << 'EOF' > /var/ossec/etc/rules/alienvault_rules.xml
          <group name="attack,">
              <rule id="100100" level="10">
                  <if_group>web|attack|attacks</if_group>
                  <list field="srcip" lookup="address_match_key">etc/lists/blacklist-alienvault</list>
                  <description>IP address found in AlienVault reputation database.</description>
              </rule>
          </group>
          EOF
            cat << 'EOF' > /var/ossec/etc/decoders/softether.xml
          <decoder name="softether_decoder">
              <prematch type="pcre2">authentication</prematch>
          </decoder>
          <decoder name="softether_decoder_child">
              <parent>softether_decoder</parent>
              <regex type="pcre2">(\d\d\d\d-\d\d-\d\d \d\d:\d\d:\d\d.\d\d\d\d)</regex>
              <order>timestamp</order>
          </decoder>
          
          <decoder name="softether_decoder_child">
              <parent>softether_decoder</parent>
              <regex type="pcre2">IP address: (\d+\.\d+\.\d+\.\d+)</regex>
              <order>srcip</order>
          </decoder>
          
          <decoder name="softether_decoder_child">
              <parent>softether_decoder</parent>
              <regex type="pcre2">User authentication failed. The user name that has been provided was "(\S+)"</regex>
              <order>srcuser</order>
          </decoder>
          
          <decoder name="softether_decoder_child">
              <parent>softether_decoder</parent>
              <regex type="pcre2">Port number: (\d+)</regex>
              <order>srcport</order>
          </decoder>
          <decoder name="softether_decoder_child">
              <parent>softether_decoder</parent>
              <regex type="pcre2">and the user name is "(\S+)"</regex>
              <order>srcuser</order>
          </decoder>
          EOF
            cat << 'EOF' > /var/ossec/etc/decoders/softether_more.xml
          <decoder name="Softether_more">
              <prematch type="pcre2"> VPN Client details</prematch>
          </decoder>
          <decoder name="Softether_more_child">
              <parent>Softether_more</parent>
              <regex type="pcre2">(\d\d\d\d-\d\d-\d\d \d\d:\d\d:\d\d.\d\d\d\d)</regex>
              <order>timestamp</order>
          </decoder>
          <decoder name="Softether_more_child">
              <parent>Softether_more</parent>
              <regex type="pcre2">Client OS name: "(.*?)",</regex>
              <order>os_system</order>
          </decoder>
          
          <decoder name="Softether_more_child">
             <parent>Softether_more</parent>
             <regex type="pcre2">Client host name: (\S+),</regex>
             <order>user_hostname</order>
          </decoder>

          <decoder name="Softether_more_child">
             <parent>Softether_more</parent>
             <regex type="pcre2">Session "SID-(\S+)-.*?</regex>
             <order>srcuser</order>
          </decoder>
          EOF
            cat << 'EOF' > /var/ossec/etc/decoders/softether_access.xml
          <decoder name="softether_decoder_access">
              <prematch type="pcre2">The new session</prematch>
          </decoder>
          <decoder name="softether_decoder_access_child">
              <parent>softether_decoder_access</parent>
              <regex type="pcre2">(\d\d\d\d-\d\d-\d\d \d\d:\d\d:\d\d.\d\d\d\d)</regex>
              <order>timestamp</order>
          </decoder>
          <decoder name="softether_decoder_access_child">
              <parent>softether_decoder_access</parent>
              <regex type="pcre2">IP address: (\d+\.\d+\.\d+\.\d+),</regex>
              <order>srcip</order>
          </decoder>
          <decoder name="softether_decoder_access_child">
             <parent>softether_decoder_access</parent>
             <regex type="pcre2">The new session "SID-(\S+)-.*?</regex>
             <order>srcuser</order>
          </decoder>
          EOF
            cat << 'EOF' > /var/ossec/etc/rules/softether_more.xml
          <group name="Softether_more">
            <rule id="100802" level="0" noalert="1">
              <decoded_as>Softether_more</decoded_as>
              <description>Softether mode info access server messages user</description>
            </rule>
            <rule id="100804" level="3">
              <if_sid>100802</if_sid>
              <match>VPN Client details</match>
              <description>Softether User authentication successful $(srcuser) with OS $(os_system) and hostname $(user_hostname)</description>
            </rule>
          </group>
          EOF
            # Traffic monitoring decoder and rules
            cat << 'EOF' > /var/ossec/etc/decoders/softether_traffic.xml
          <decoder name="softether_traffic_decoder">
              <program_name>^softether-traffic$</program_name>
          </decoder>
          <decoder name="softether_traffic_decoder_child">
              <parent>softether_traffic_decoder</parent>
              <regex type="pcre2">user=(\S+) srcip=(\S+) tx_bytes=(\d+) rx_bytes=(\d+) delta_tx=(\d+) delta_rx=(\d+)</regex>
              <order>srcuser, srcip, tx_bytes, rx_bytes, delta_tx, delta_rx</order>
          </decoder>
          <decoder name="softether_traffic_alert_decoder">
              <program_name>^softether-traffic-alert$</program_name>
          </decoder>
          <decoder name="softether_traffic_alert_decoder_child">
              <parent>softether_traffic_alert_decoder</parent>
              <regex type="pcre2">(\S+) session=\S+ user=(\S+) srcip=(\S+)</regex>
              <order>alert_type, srcuser, srcip</order>
          </decoder>
          EOF
            cat << 'EOF' > /var/ossec/etc/rules/softether_traffic.xml
          <group name="softether_traffic">
            <!-- Base rule for traffic logs -->
            <rule id="100900" level="0" noalert="1">
              <decoded_as>softether_traffic_decoder</decoded_as>
              <description>SoftEther VPN traffic monitoring event</description>
            </rule>

            <!-- High traffic alert (>100MB in 5 min) -->
            <rule id="100901" level="10">
              <decoded_as>softether_traffic_alert_decoder</decoded_as>
              <match>HIGH_TRAFFIC</match>
              <description>SoftEther HIGH TRAFFIC detected: user $(srcuser) from $(srcip) transferred over 100MB in 5 minutes</description>
            </rule>

            <!-- Unusual packet ratio (potential port scan) -->
            <rule id="100902" level="12">
              <decoded_as>softether_traffic_alert_decoder</decoded_as>
              <match>UNUSUAL_PACKET_RATIO</match>
              <description>SoftEther UNUSUAL PACKET RATIO detected: user $(srcuser) from $(srcip) - possible port scanning or DDoS</description>
            </rule>

            <!-- Sustained high traffic (high traffic alert fired 3+ times in 30 min) -->
            <rule id="100903" level="13" frequency="3" timeframe="1800">
              <if_matched_sid>100901</if_matched_sid>
              <description>SoftEther SUSTAINED HIGH TRAFFIC: user $(srcuser) from $(srcip) - possible data exfiltration</description>
            </rule>

            <!-- Multiple unusual packet ratio events (possible attack in progress) -->
            <rule id="100904" level="14" frequency="3" timeframe="900">
              <if_matched_sid>100902</if_matched_sid>
              <description>SoftEther REPEATED UNUSUAL TRAFFIC PATTERN: user $(srcuser) from $(srcip) - active attack suspected</description>
            </rule>
          </group>
          EOF
            sed -i '268i\ \ \ \ <list>etc/lists/blacklist-alienvault</list>' /var/ossec/etc/ossec.conf
            # Backup Wazuh config to EBS
            cp -a /var/ossec/etc/ossec.conf $WCONFIG_MNT/ossec.conf
            cp -a /var/ossec/etc/rules/ $WCONFIG_MNT/rules/
            cp -a /var/ossec/etc/decoders/ $WCONFIG_MNT/decoders/
            cp -a /var/ossec/etc/lists/ $WCONFIG_MNT/lists/
          else
            # Restore Wazuh config from EBS
            cp -a $WCONFIG_MNT/ossec.conf /var/ossec/etc/ossec.conf
            cp -a $WCONFIG_MNT/rules/* /var/ossec/etc/rules/
            cp -a $WCONFIG_MNT/decoders/* /var/ossec/etc/decoders/
            cp -a $WCONFIG_MNT/lists/* /var/ossec/etc/lists/
            chown -R wazuh:wazuh /var/ossec/etc/rules/ /var/ossec/etc/decoders/ /var/ossec/etc/lists/
          fi
          
          systemctl restart wazuh-manager
          
          # Import Wazuh dashboard visualizations
          # Wait for the dashboard to be ready
          for i in $(seq 1 60); do
            curl -sk https://localhost:443 && break
            sleep 5
          done
          sleep 10
          
          # Create the wazuh-alerts-* index pattern required by visualizations
          curl -sk -X POST "https://localhost:443/api/saved_objects/index-pattern/wazuh-alerts-*" \
            -H "osd-xsrf: true" \
            -H "Content-Type: application/json" \
            -u "admin:${WazuhPassword}" \
            -d '{"attributes":{"title":"wazuh-alerts-*","timeFieldName":"timestamp"}}'
          
          # Download and import the visualizations
          wget -q https://raw.githubusercontent.com/danf22/softether_wazuh/main/Visualizations.ndjson -O /tmp/Visualizations.ndjson
          curl -sk -X POST "https://localhost:443/api/saved_objects/_import?overwrite=true" \
            -H "osd-xsrf: true" \
            -u "admin:${WazuhPassword}" \
            -F "file=@/tmp/Visualizations.ndjson"
          rm -f /tmp/Visualizations.ndjson
          
          INSTALL_STATUS=$?
          /opt/aws/bin/cfn-signal -e $INSTALL_STATUS --stack ${AWS::StackName} --resource WazuhInstance --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: Wazuh
    CreationPolicy:
        ResourceSignal:
          Timeout: PT10M

       
      
Outputs:
  URLWazuh:
    Description: Url of Wazuh
    Value: !Sub "https://${WazuhInstance.PrivateIp}"

  IPSoftether:
    Description: Ip of the VPN
    Value: !Sub "${EIP.PublicIp}"
